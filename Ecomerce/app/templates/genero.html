{% extends "base.html" %}
{% block title %}{{ genero }} · Blockbuster{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Género: {{ genero }}</h1>
  <a href="{% url 'main' %}" class="btn btn-outline-secondary">Volver al inicio</a>
</div>

<div class="row g-3">
  {% for p in peliculas %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card h-100">
        <img src="{{ p.imagen }}" class="card-img-top" alt="{{ p.titulo }}">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ p.titulo }}</h5>
          <p class="mb-2"><strong>Precio:</strong> {{ p.precio }}</p>
          <a href="{% url 'detalles' p.id %}" class="btn btn-primary mt-auto">Ver detalle</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No hay productos en esta categoría.</p>
  {% endfor %}
</div>
{% endblock %}
